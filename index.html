<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMB Service</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F7FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMB">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#F4F7FA;--ink:#1B2A4A;--mute:#5E6B80;--card:#FFFFFF;--line:#DCE3EC;--acc:#22A85A;--accink:#FFFFFF;--blue:#1E88E5;--ok:#22A85A;--bad:#DC2626;--warn:#F59E0B;--grad:linear-gradient(135deg,#22A85A,#1E88E5);--shadow:0 1px 3px rgba(27,42,74,.08),0 4px 14px rgba(27,42,74,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
input{width:100%;padding:13px;font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.acc{background:var(--grad);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:8px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.big{width:100%;font-size:18px;padding:16px}
.outlets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outlet{padding:14px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.outlet.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.outlet small{display:block;color:var(--mute);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line)}
.tag.run{background:var(--blue);color:#fff}.tag.paid{background:var(--ok);color:#fff}.tag.unpaid{background:var(--warn);color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--grad)}
#qr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:12px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;background:var(--ink);color:#fff;padding:14px;border-radius:12px;z-index:9}
.s{border-top:1px solid var(--line);padding:12px 0}.s:first-child{border-top:0}
.mute{color:var(--mute);font-size:14px}
.hi{margin:0 0 12px}.hi b{font-size:18px}.hi .tag{margin-left:6px}
.admin-menu{position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0 10px;margin:0 -2px 4px}
.admin-menu-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.admin-menu button{padding:11px 8px;font-size:13px;line-height:1.15;min-height:46px}
.admin-menu button.active{background:var(--grad);color:#fff;border-color:transparent}
.admin-section-title{margin-top:14px}
@media(max-width:380px){.admin-menu-inner{grid-template-columns:1fr}.admin-menu button{min-height:42px}}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:8px;margin:6px 0 14px;font-size:26px;font-weight:800;font-style:italic;letter-spacing:-.5px}
.brand svg{width:28px;height:28px;fill:var(--acc)}.brand b{color:var(--acc)}

.hello{font-size:20px;font-weight:800;margin:4px 0 0}
.ocs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oc{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px}
.oc.sel{border-color:var(--ok);background:#E8F6EE}
.oc svg{width:26px;height:26px;fill:var(--acc);flex:none}
.oc small{display:block;font-weight:400;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--bad)}.dot.use{background:var(--blue)}
.chips button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 4px;font-size:14px}
.chips button.sel{border-color:var(--acc);color:var(--acc);background:#E8F6EE}
.stripe{height:14px;border-radius:4px;overflow:hidden;background:#E3EAF2;margin:12px 0}
.stripe i{display:block;height:100%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px),var(--grad)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);margin-top:6px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:600;border-radius:10px;padding:16px;font-size:18px}
.btn.acc{background:var(--grad);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(27,42,74,.06);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 10px;border-radius:0;border-bottom:2px solid transparent}
.nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== KONFIGURASI (isi sendiri; anon key memang publik, JANGAN isi service role) =====
var SUPABASE_URL = "https://yloxoxgvedepmegihver.supabase.co";
var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3hveGd2ZWRlcG1lZ2lodmVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mzk4NDYsImV4cCI6MjEwMzMxNTg0Nn0.b74It13ynjkLSBqsvyuYbWmo0TkL0ztb1bj9d8TAerc";
var QRIS_STATIC = "00020101021126570011ID.DANA.WWW011893600915303471271802090347127180303UMI51440014ID.CO.QRIS.WWW0215ID10265837741240303UMI5204739453033605802ID5916Semilir Semarang6013Kota Semarang6105501166304285A"; // dari OMB Nota Cas
var API = SUPABASE_URL + "/functions/v1/charge-api";

var sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
var $app = document.getElementById("app");
var S = { user: null, admin: false, tab: "charge", adminMenu: "sessions", outlets: [], tariff: 0, maxWh: 5000, sess: null, all: [], names: {}, outlet: 1, sig: "", profile: null, busy: {}, tgt: null, custom: "", pwOpen: false, np1: "", np2: "", members: null, msq: "", unl: null, asq: "" };

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rp(n) { return "Rp" + Number(n || 0).toLocaleString("id-ID"); }
function tgtVal() { var t = S.tgt === "custom" ? parseInt(S.custom, 10) : S.tgt; return t && t > 0 ? t : 0; }
function poin(wh) { return Math.round(Number(wh || 0)).toLocaleString("id-ID"); } // 1 poin = 1 Wh
function toast(m) {
  var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = m;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500);
}

// ===== QRIS DINAMIS =====
function crc16(s) {
  var c = 0xFFFF;
  for (var i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1);
    c &= 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function qrisDynamic(amount) {
  var f = [], p = QRIS_STATIC, k = 0;
  while (k < p.length) { var l = parseInt(p.substr(k + 2, 2), 10); f.push({ t: p.substr(k, 2), v: p.substr(k + 4, l) }); k += 4 + l; }
  f = f.filter(function (x) { return x.t !== "63" && x.t !== "54"; });
  f.forEach(function (x) { if (x.t === "01") x.v = "12"; });
  var ci = -1; f.forEach(function (x, n) { if (x.t === "53") ci = n; });
  var a = { t: "54", v: String(Math.round(amount)) };
  if (ci >= 0) f.splice(ci + 1, 0, a); else f.push(a);
  var s = f.map(function (x) { return x.t + String(x.v.length).padStart(2, "0") + x.v; }).join("") + "6304";
  return s + crc16(s);
}

// ===== API =====
async function api(path, body) {
  var s = (await sb.auth.getSession()).data.session;
  var r = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (s ? s.access_token : "") },
    body: JSON.stringify(body || {})
  });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.message || j.error || "Gagal (" + r.status + ")");
  return j;
}

// ===== DATA =====
async function load() {
  var u = S.user.id;
  var q = await Promise.all([
    sb.from("charge_outlets").select("*").order("id"),
    sb.from("charge_tariffs").select("price_per_kwh").order("effective_from", { ascending: false }).limit(1),
    sb.from("charge_config").select("max_target_wh").maybeSingle(),
    sb.from("charge_sessions").select("*").eq("user_id", u).order("created_at", { ascending: false }).limit(1)
  ]);
  S.outlets = q[0].data || [];
  S.tariff = q[1].data && q[1].data[0] ? q[1].data[0].price_per_kwh : 0;
  S.maxWh = q[2].data ? q[2].data.max_target_wh : 5000;
  S.sess = q[3].data && q[3].data[0] ? q[3].data[0] : null;
  if (S.tab === "riwayat") {
    var hq = await sb.from("charge_sessions").select("*").eq("user_id", u).order("created_at", { ascending: false }).limit(30);
    S.hist = hq.data || [];
  }
  // Utamakan RPC charge_busy_outlets() (bisa dibaca semua user, tanpa membuka data sesi orang lain).
  var bz = await sb.rpc("charge_busy_outlets");
  if (bz.error) bz = await sb.from("charge_sessions").select("outlet_id").in("status", ["pending", "running"]);
  S.busy = {};
  (bz.data || []).forEach(function (x) { S.busy[x.outlet_id] = true; });
  if (S.admin && S.tab === "admin") {
    var a = await sb.from("charge_sessions").select("*").order("created_at", { ascending: false }).limit(30);
    S.all = a.data || [];
    var ids = S.all.map(function (x) { return x.member_id; });
    var m = await sb.from("anggota_omb").select("id,nama").in("id", ids);
    if (m.data) m.data.forEach(function (x) { S.names[x.id] = x.nama; });
  }
  if (S.admin && S.tab === "admin" && S.members === null) {
    try { S.members = (await api("/admin/members")).members || []; } catch (e) { S.members = []; toast("Daftar anggota gagal dimuat: " + e.message); }
  }
  if (S.admin && S.tab === "admin" && S.unl === null) {
    try { S.unl = (await api("/admin/unlinked")).anggota || []; } catch (e) { S.unl = []; toast("Daftar anggota gagal dimuat: " + e.message); }
  }
  var sig = JSON.stringify([S.sess, S.all, S.tariff, S.tab, S.adminMenu, S.outlets, S.busy, S.members, S.unl, S.pwOpen, S.hist]);
  var typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (sig !== S.sig && !typing) { S.sig = sig; render(); } // tunda render saat pengguna sedang mengetik
}

// ===== TAMPILAN =====
function login(err) {
  $app.innerHTML = '<h1>OMB Service</h1><p class="sub">Masuk dengan akun anggota.</p><div class="card">' +
    '<label class="mute" for="em">Email</label><input id="em" type="email" autocomplete="username">' +
    '<label class="mute" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">' +
    '<p class="mute" style="color:var(--bad)">' + esc(err || "") + '</p>' +
    '<button class="big acc" data-act="login">Masuk</button></div>';
}

function ic(n) {
  var p = {
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    riwayat: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    setting: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    profil: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    admin: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
  };
  return '<svg viewBox="0 0 24 24">' + p[n] + '</svg>';
}
var BOLT = '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8z"/></svg>';
function nm() { var p = S.profile; return p && p.nama ? p.nama : (S.user.email || "Anggota"); }
function fmt(x, d) { return Number(x).toFixed(d).replace(".", ","); }

function head() { return '<div class="brand">' + BOLT + '<span><b>OMB</b> Service</span></div>'; }

function navBar() {
  var items = [["charge", "home", "Home"], ["riwayat", "riwayat", "Riwayat"], ["setting", "setting", "Setting"], ["profil", "profil", "Profil"]];
  if (S.admin) items.push(["admin", "admin", "Admin"]);
  return '<nav class="nav">' + items.map(function (x) {
    return '<button class="' + (S.tab === x[0] ? "on" : "") + '" data-act="tab" data-v="' + x[0] + '">' + ic(x[1]) + x[2] + '</button>';
  }).join("") + '</nav>';
}

// Saldo coin: tempat sudah disiapkan, data belum diisi (S.coin diisi nanti)
function coinCard() {
  var has = S.coin != null;
  return '<div class="card"><span class="mute">Saldo Coin</span><div class="num" style="color:var(--acc);font-size:30px">' +
    (has ? Number(S.coin).toLocaleString("id-ID") + ' <small class="mute">Coin</small>' : "—") + '</div>' +
    (has ? "" : '<span class="mute">Segera tersedia</span>') + '</div>';
}

// Arus/tegangan/daya real-time; baris yang datanya kosong disembunyikan
function devRows(s) {
  var r = [["Arus (A)", s.last_current_a, 2, "A"], ["Tegangan (V)", s.last_voltage_v, 0, "V"], ["Daya (W)", s.last_power_w, 0, "W"]]
    .filter(function (x) { return x[1] != null; });
  if (!r.length) return "";
  return '<div class="card"><b>Informasi Perangkat</b> <span class="mute">(Real-time)</span>' + r.map(function (x) {
    return '<div class="kv"><span>' + x[0] + '</span><b>' + fmt(x[1], x[2]) + ' ' + x[3] + '</b></div>';
  }).join("") + '</div>';
}

function render() {
  if (!S.user) return login();
  var v = S.tab === "admin" && S.admin ? adminView() : S.tab === "riwayat" ? histView() : S.tab === "setting" ? settingView() : S.tab === "profil" ? profilView() : userView();
  $app.innerHTML = head() + v + navBar();
  var q = document.getElementById("qr");
  if (q && S.sess) {
    try { new QRCode(q, { text: qrisDynamic(S.sess.amount_idr), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { q.textContent = "QRIS belum diatur"; }
  }
}

function userView() {
  var s = S.sess;
  if (s && (s.status === "pending" || s.status === "running")) {
    var run = s.status === "running";
    var used = run ? Math.max(0, (s.last_wh || s.start_wh) - s.start_wh) : 0;
    var tg = Number(s.target_wh || 0), pct = tg ? Math.min(100, used / tg * 100) : 0;
    return '<div class="card"><div class="row"><span class="dot' + (run ? "" : " off") + '"></span><b>Colokan ' + s.outlet_id + '</b></div>' +
      '<div class="mute">Sesi #' + esc(String(s.id).slice(-6).toUpperCase()) + '</div></div>' +
      '<div class="card"><span class="tag run">' + (s.status === "pending" ? "Menunggu perangkat" : s.stop_requested_at ? "Menghentikan..." : "Sesi aktif") + '</span>' +
      '<div class="num">' + poin(used) + ' <small class="mute">Poin</small></div>' +
      '<div class="mute">dari ' + poin(tg) + ' Poin</div><div class="stripe"><i style="width:' + pct + '%"></i></div>' +
      '<div><b style="color:var(--acc)">' + poin(Math.max(0, tg - used)) + '</b> <span class="mute">Poin tersisa</span></div>' +
      '<div class="mute" style="margin-top:6px">Perkiraan biaya ' + rp(Math.ceil(used * s.tariff_per_kwh / 1000 / 100) * 100) + '</div></div>' +
      devRows(s) +
      '<button class="big ghost" data-act="stop"' + (s.stop_requested_at ? " disabled" : "") + '>■ Akhiri Sesi</button>' +
      '<p class="mute">Berhenti saat Anda menekan Akhiri Sesi, atau otomatis jika tidak ada aliran listrik 10 detik.</p>';
  }
  if (s && s.payment_status === "unpaid") {
    var wa = "https://wa.me/6285128052599?text=" + encodeURIComponent("Halo admin OMB Service, saya " + nm() + " sudah membayar tagihan charge " + rp(s.amount_idr) + " (" + poin(s.used_wh) + " Poin, Colokan " + s.outlet_id + "). Mohon diverifikasi.");
    return '<h2>Pembayaran</h2><div class="card"><span class="mute">Total Pembayaran</span><div class="num" style="color:var(--acc)">' + rp(s.amount_idr) + '</div>' +
      '<div class="kv"><span>Pemakaian</span><b>' + poin(s.used_wh) + ' Poin</b></div><div class="kv"><span>Colokan</span><b>Colokan ' + s.outlet_id + '</b></div></div>' +
      '<div class="card" style="text-align:center"><b>Scan untuk Membayar</b><div id="qr"></div><div class="mute">Buka aplikasi pembayaran favoritmu dan scan QRIS di atas.</div></div>' +
      '<div class="card mute">Admin akan memverifikasi pembayaran secara manual, lalu Anda bisa mengisi lagi.</div>' +
      '<a class="btn acc" href="' + wa + '" target="_blank" rel="noopener">Saya Sudah Bayar</a>';
  }
  var o = S.outlets.map(function (x) {
    var inUse = !!S.busy[x.id], ok = x.is_available && !inUse;
    return '<button class="oc ' + (S.outlet === x.id ? "sel" : "") + '" data-act="outlet" data-v="' + x.id + '"' + (ok ? "" : " disabled") + '>' + BOLT +
      '<span>' + esc(x.name) + '<small><span class="dot' + (inUse ? " use" : ok ? "" : " off") + '"></span>' + (inUse ? "Dipakai" : x.is_available ? "Tersedia" : "Tidak tersedia") + '</small></span></button>';
  }).join("");
  var chips = [1000, 2500, 5000].map(function (n) {
    return '<button class="' + (S.tgt === n ? "sel" : "") + '" data-act="tgt" data-v="' + n + '">' + poin(n) + ' Poin</button>';
  }).join("");
  var last = s && s.payment_status === "paid" ? '<p class="mute">Sesi terakhir: ' + poin(s.used_wh) + ' Poin, ' + rp(s.amount_idr) + ' (lunas).</p>' : "";
  return '<p class="hello">Halo, ' + esc(nm()) + ' 👋</p><p class="sub">Pilih colokan dan jumlah poin, lalu tekan Mulai.</p>' + coinCard() +
    '<h2>Pilih Colokan</h2><div class="ocs">' + o + '</div>' +
    '<h2>Pilih Jumlah Poin</h2><input id="cp" type="number" inputmode="numeric" min="1" max="' + S.maxWh + '" placeholder="Masukkan jumlah Poin (maks ' + poin(S.maxWh) + ')" value="' + esc(S.tgt === "custom" ? S.custom : "") + '">' +
    '<div class="chips row" style="margin:10px 0">' + chips + '</div>' +
    '<p class="mute">Tagihan dihitung dari pemakaian saat Akhiri Sesi.</p>' + last +
    '<button id="startBtn" class="big acc" data-act="start"' + (tgtVal() ? "" : " disabled") + '>⚡ MULAI</button>';
}

function histView() {
  var h = S.hist || [];
  return '<h2>Riwayat</h2>' + (h.length ? h.map(function (x) {
    var run = x.status === "pending" || x.status === "running";
    var tg = run ? '<span class="tag run">Berjalan</span>' : x.payment_status === "paid" ? '<span class="tag paid">Lunas</span>' :
      x.payment_status === "unpaid" ? '<span class="tag unpaid">Belum bayar</span>' : '<span class="tag">' + esc(x.status) + '</span>';
    return '<div class="card"><div class="row sp"><b>Colokan ' + x.outlet_id + '</b>' + tg + '</div><div class="mute">' +
      new Date(x.created_at).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) +
      '</div><div class="row sp"><span>' + poin(x.used_wh) + ' Poin</span><b>' + rp(x.amount_idr) + '</b></div></div>';
  }).join("") : '<p class="mute">Belum ada riwayat.</p>');
}

function settingView() {
  var pw = S.pwOpen ? '<div class="card"><b>Ubah password</b>' +
    '<label class="mute" for="np1">Password baru (minimal 8 karakter)</label><input id="np1" type="password" autocomplete="new-password" value="' + esc(S.np1) + '">' +
    '<label class="mute" for="np2">Ulangi password baru</label><input id="np2" type="password" autocomplete="new-password" value="' + esc(S.np2) + '">' +
    '<div class="row" style="margin-top:10px"><button class="acc" data-act="pwsave">Simpan</button><button class="ghost" data-act="pwform">Batal</button></div></div>' : "";
  return '<h2>Setting</h2><div class="card"><button class="ghost big" data-act="pwform">Ubah password</button></div>' + pw +
    '<button class="big bad" data-act="logout">Keluar</button>';
}

function profilView() {
  var p = S.profile;
  return '<h2>Profil</h2><div class="card"><div class="num" style="font-size:26px">' + esc(nm()) + '</div>' +
    (p && p.id != null ? '<span class="tag">ID Anggota: ' + esc(p.id) + '</span>' : "") +
    '<div class="mute" style="margin-top:8px">' + esc(S.user.email || "") + '</div></div>' + coinCard();
}

function memberRows() {
  if (S.members === null) return '<p class="mute">Memuat...</p>';
  var q = S.msq.trim().toLowerCase();
  var list = S.members.filter(function (m) {
    return !q || [m.nama_panggilan, m.id_anggota, m.email].join(" ").toLowerCase().indexOf(q) >= 0;
  }).slice(0, 30);
  if (!list.length) return '<p class="mute">Tidak ada anggota ditemukan.</p>';
  return list.map(function (m) {
    return '<div class="s"><div class="row sp"><div><b>' + esc(m.nama_panggilan || m.nama || "-") + '</b> <span class="mute">' + esc(m.id_anggota || "") + '</span>' +
      '<div class="mute">' + esc(m.email || "") + '</div></div><button class="sm" data-act="resetpw" data-v="' + esc(m.user_id) + '">Reset</button></div></div>';
  }).join("");
}

function unlinkedRows() {
  if (S.unl === null) return '<p class="mute">Memuat...</p>';
  var q = S.asq.trim().toLowerCase();
  var list = S.unl.filter(function (m) {
    return !q || [m.nama_panggilan, m.nama, m.id_anggota].join(" ").toLowerCase().indexOf(q) >= 0;
  }).slice(0, 30);
  if (!list.length) return '<p class="mute">Semua anggota sudah punya akun.</p>';
  return list.map(function (m) {
    return '<div class="s"><div class="row sp"><div><b>' + esc(m.nama_panggilan || m.nama || "-") + '</b> <span class="mute">' + esc(m.id_anggota || "") + '</span></div>' +
      '<button class="sm" data-act="mkuser" data-v="' + esc(m.id) + '">Buat akun</button></div></div>';
  }).join("");
}

function genPw() {
  var a = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = new Uint32Array(10), o = "";
  crypto.getRandomValues(r);
  for (var i = 0; i < r.length; i++) o += a[r[i] % a.length];
  return o;
}

function adminView() {
  var rows = S.all.map(function (x) {
    var btn = "";
    if (x.payment_status === "unpaid") btn += '<button class="sm" data-act="paid" data-v="' + x.id + '">Tandai lunas</button> ';
    if (x.status === "running") btn += '<button class="sm ghost" data-act="finish" data-v="' + x.id + '">Selesaikan manual</button> ';
    if (x.status === "pending") btn += '<button class="sm ghost" data-act="cancel" data-v="' + x.id + '">Batalkan</button> ';
    var pay = x.payment_status === "paid" ? "paid" : x.payment_status === "unpaid" ? "unpaid" : "";
    return '<div class="s"><div class="row sp"><b>' + esc(S.names[x.member_id] || "Member " + x.member_id) + '</b><span class="tag ' + (x.status === "running" ? "run" : pay) + '">' + esc(x.status) + '</span></div>' +
      '<div class="mute">Colokan ' + x.outlet_id + ' - ' + new Date(x.created_at).toLocaleString("id-ID") + '</div>' +
      '<div>' + (x.used_wh != null ? poin(x.used_wh) + ' Poin, ' + rp(x.amount_idr) : 'Target ' + poin(x.target_wh) + ' Poin') +
      (x.status === "running" ? ' <span class="mute">(terakhir ' + poin((x.last_wh || x.start_wh) - x.start_wh) + ' Poin)</span>' : "") + '</div>' +
      (x.stop_reason ? '<div class="mute">Berhenti: ' + esc(x.stop_reason) + '</div>' : "") +
      '<div class="row" style="margin-top:6px;flex-wrap:wrap">' + btn + '</div></div>';
  }).join("");

  var menu =
    '<div class="admin-menu"><div class="admin-menu-inner">' +
      '<button class="' + (S.adminMenu === "add" ? "active" : "") + '" data-act="adminmenu" data-v="add">➕<br>Tambah anggota</button>' +
      '<button class="' + (S.adminMenu === "reset" ? "active" : "") + '" data-act="adminmenu" data-v="reset">🔑<br>Reset anggota</button>' +
      '<button class="' + (S.adminMenu === "sessions" ? "active" : "") + '" data-act="adminmenu" data-v="sessions">🕘<br>Sesi terbaru</button>' +
    '</div></div>';

  var common =
    '<button class="big bad" data-act="off">OFF darurat colokan 1</button>' +
    '<h2>Tarif per 1.000 poin</h2><div class="card"><div class="mute">Sekarang ' + rp(S.tariff) + '. Sesi yang sudah berjalan tidak berubah.</div>' +
    '<div class="row" style="margin-top:8px"><input id="tf" type="number" inputmode="numeric" min="1" placeholder="Rupiah per 1.000 poin"><button data-act="tariff">Simpan tarif</button></div></div>';

  var addSection =
    '<h2 class="admin-section-title">Tambah akun anggota</h2><div class="card"><div class="mute">Anggota yang belum punya akun login.</div>' +
    '<input id="as" type="search" placeholder="Cari nama atau ID anggota" value="' + esc(S.asq) + '" style="margin-top:8px">' +
    '<div id="alist">' + unlinkedRows() + '</div></div>';

  var resetSection =
    '<h2 class="admin-section-title">Reset password anggota</h2><div class="card"><input id="ms" type="search" placeholder="Cari nama, ID anggota, atau email" value="' + esc(S.msq) + '">' +
    '<div id="mlist">' + memberRows() + '</div></div>';

  var sessionSection =
    '<h2 class="admin-section-title">Sesi terbaru</h2><div class="card">' +
    (rows || '<p class="mute">Belum ada sesi.</p>') + '</div>';

  var section = S.adminMenu === "add" ? addSection : (S.adminMenu === "reset" ? resetSection : sessionSection);

  return menu + common + section;
}

// ===== AKSI =====
document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, v = b.dataset.v;
  try {
    if (act === "login") {
      var r = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
      if (r.error) return login("Email atau password salah.");
      return boot();
    }
    if (act === "logout") { await sb.auth.signOut(); S.user = null; S.profile = null; S.members = null; S.unl = null; S.pwOpen = false; S.np1 = ""; S.np2 = ""; S.sig = ""; return login(); }
    if (act === "tab") {
      S.tab = v;
      if (v === "admin") S.adminMenu = "sessions";
      S.sig = "";
      return load();
    }
    if (act === "adminmenu") {
      S.adminMenu = v || "sessions";
      S.sig = "";
      return render();
    }
    if (act === "outlet") {
      var o = S.outlets.filter(function (x) { return String(x.id) === v; })[0];
      if (!o || !o.is_available) return toast("Colokan tidak tersedia");
      if (S.busy[o.id]) return toast("Colokan sedang dipakai");
      S.outlet = o.id; S.sig = ""; return render();
    }
    if (act === "pwform") { S.pwOpen = !S.pwOpen; S.np1 = ""; S.np2 = ""; S.sig = ""; return render(); }
    if (act === "pwsave") {
      var n1 = document.getElementById("np1").value, n2 = document.getElementById("np2").value;
      if (n1.length < 8) return toast("Password minimal 8 karakter");
      if (n1 !== n2) return toast("Ulangi password tidak sama");
      b.disabled = true;
      var ur = await sb.auth.updateUser({ password: n1 });
      if (ur.error) {
        var em = String(ur.error.message || "");
        throw new Error(/same/i.test(em) ? "Password baru tidak boleh sama dengan yang lama" : "Gagal mengubah password: " + em);
      }
      S.pwOpen = false; S.np1 = ""; S.np2 = ""; S.sig = ""; render(); return toast("Password berhasil diubah");
    }
    if (act === "mkuser") {
      var am = (S.unl || []).filter(function (m) { return String(m.id) === v; })[0];
      if (!am) return;
      var an = am.nama_panggilan || am.nama || "anggota";
      var em0 = String(an).toLowerCase().replace(/[^a-z0-9]+/g, "") + "@omb.id";
      var em = prompt("Email login untuk " + an + " (" + am.id_anggota + "):", em0);
      if (em === null) return;
      em = em.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast("Format email tidak valid");
      var pw0 = prompt("Password awal (minimal 8 karakter). Boleh diganti:", genPw());
      if (pw0 === null) return;
      pw0 = pw0.trim();
      if (pw0.length < 8) return toast("Password minimal 8 karakter");
      await api("/admin/create-user", { member_id: am.id, email: em, password: pw0 });
      alert("Akun " + an + " berhasil dibuat.\n\nEmail: " + em + "\nPassword: " + pw0 + "\n\nSampaikan ke anggota, lalu minta segera menggantinya lewat tombol Password.");
      S.unl = null; S.members = null; S.sig = ""; return load();
    }
    if (act === "resetpw") {
      var mem = (S.members || []).filter(function (m) { return m.user_id === v; })[0];
      var nm = mem ? (mem.nama_panggilan || mem.email) : "anggota";
      var np = prompt("Password baru untuk " + nm + " (minimal 8 karakter). Boleh diganti:", genPw());
      if (np === null) return;
      np = np.trim();
      if (np.length < 8) return toast("Password minimal 8 karakter");
      await api("/admin/reset-password", { user_id: v, new_password: np });
      alert("Password " + nm + " sudah direset.\n\nPassword baru: " + np + "\n\nSampaikan ke anggota, lalu minta segera menggantinya lewat tombol Password.");
      return;
    }
    if (act === "tgt") {
      var nv = v === "custom" ? "custom" : parseInt(v, 10);
      S.tgt = (S.tgt === nv) ? null : nv; // tekan lagi = batal pilih
      S.custom = ""; S.sig = ""; return render();
    }
    if (act === "start") {
      var o2 = S.outlets.filter(function (x) { return x.id === S.outlet; })[0];
      if (!o2 || !o2.is_available) return toast("Colokan tidak tersedia");
      if (S.busy[o2.id]) return toast("Colokan sedang dipakai");
      var tw = tgtVal();
      if (!tw) return toast("Pilih atau isi jumlah poin dulu");
      if (tw > S.maxWh) return toast("Maksimal " + poin(S.maxWh) + " poin");
      b.disabled = true;
      await api("/session", { outlet_id: S.outlet, target_wh: tw });
      S.tgt = null; S.custom = "";
      toast("Menunggu perangkat menyalakan colokan");
    }
    if (act === "stop") {
      if (!confirm("Hentikan pengisian sekarang?")) return;
      b.disabled = true;
      var sr = await api("/session/stop", {});
      toast(sr.action === "pending_cancelled" ? "Sesi dibatalkan" : "Perintah stop dikirim");
    }
    if (act === "paid") await api("/admin/paid", { session_id: v });
    if (act === "cancel") await api("/admin/finish", { session_id: v, action: "cancel" });
    if (act === "finish") {
      if (!confirm("Selesaikan sesi dengan poin dari status terakhir perangkat?")) return;
      await api("/admin/finish", { session_id: v });
    }
    if (act === "off") {
      if (!confirm("Matikan colokan 1 sekarang?")) return;
      var res = await api("/admin/off", { outlet_id: 1 });
      toast(res.action === "stop_requested" ? "Perintah OFF dikirim, relay mati dalam beberapa detik" : "OFF diproses: " + res.action);
    }
    if (act === "tariff") {
      var p = parseInt(document.getElementById("tf").value, 10);
      if (!p || p < 1) return toast("Isi tarif dalam rupiah");
      var ins = await sb.from("charge_tariffs").insert({ price_per_kwh: p });
      if (ins.error) throw new Error("Gagal menyimpan tarif");
      toast("Tarif disimpan");
    }
    S.sig = ""; load();
  } catch (err) { toast(err.message); b.disabled = false; }
});

// ===== PROFIL ANGGOTA (tabel anggota_omb: id_anggota, nama_panggilan) =====
async function loadProfile() {
  var u = S.user, m = null, errs = [];
  // Utamakan RPC my_member() (charge_profiles -> anggota_omb), aman untuk user biasa.
  try {
    var rp0 = await sb.rpc("my_member");
    if (!rp0.error && rp0.data && rp0.data[0]) { S.profile = { id: rp0.data[0].id_anggota, nama: rp0.data[0].nama_panggilan }; return; }
    if (rp0.error) errs.push("my_member: " + rp0.error.message);
  } catch (e) { errs.push("my_member: " + e.message); }
  async function tryQ(col, val) {
    if (m || val == null || val === "") return;
    try {
      var r = await sb.from("anggota_omb").select("id_anggota,nama_panggilan").eq(col, val).limit(1);
      if (r.error) errs.push(col + ": " + r.error.message);
      else if (r.data && r.data[0]) m = r.data[0];
    } catch (e) { errs.push(col + ": " + e.message); }
  }
  await tryQ("user_id", u.id);
  await tryQ("auth_user_id", u.id);
  await tryQ("email", u.email);
  if (S.sess) { await tryQ("id", S.sess.member_id); await tryQ("id_anggota", S.sess.member_id); }
  if (!m && errs.length) console.warn("Profil anggota tidak ditemukan:", errs);
  S.profile = m ? { id: m.id_anggota, nama: m.nama_panggilan } : null;
}

async function boot() {
  var s = (await sb.auth.getSession()).data.session;
  if (!s) return login();
  S.user = s.user;
  var a = await sb.from("charge_admins").select("user_id").eq("user_id", s.user.id).maybeSingle();
  S.admin = !!(a.data);
  await load();
  await loadProfile();
  S.sig = ""; render();
}
document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "cp") { S.custom = e.target.value; S.tgt = "custom"; document.querySelectorAll(".chips .sel").forEach(function (c) { c.classList.remove("sel"); }); var sb = document.getElementById("startBtn"); if (sb) sb.disabled = !tgtVal(); }
  if (id === "np1") S.np1 = e.target.value;
  if (id === "np2") S.np2 = e.target.value;
  if (id === "as") { S.asq = e.target.value; var al = document.getElementById("alist"); if (al) al.innerHTML = unlinkedRows(); }
  if (id === "ms") { S.msq = e.target.value; var ml = document.getElementById("mlist"); if (ml) ml.innerHTML = memberRows(); }
});
setInterval(function () { if (S.user && document.visibilityState === "visible") load(); }, 4000);
boot();
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
