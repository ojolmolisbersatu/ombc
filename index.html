<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMB Charge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2ee;--ink:#0f2a22;--mute:#5d6f68;--card:#fff;--line:#d3ddd7;--acc:#f2b705;--accink:#2b2100;--ok:#1b7a4b;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a15;--ink:#e6efe9;--mute:#93a69d;--card:#15271f;--line:#28403a;--ok:#4cc38a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
input{width:100%;padding:13px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button.acc{background:var(--acc);color:var(--accink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:8px 10px;font-size:14px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{width:100%;font-size:18px;padding:16px}
.outlets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outlet{padding:14px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.outlet.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.outlet small{display:block;color:var(--mute);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line)}
.tag.run{background:var(--acc);color:var(--accink)}.tag.paid{background:var(--ok);color:#fff}.tag.unpaid{background:var(--bad);color:#fff}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc)}
#qr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:12px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px;border-radius:12px;z-index:9}
.s{border-top:1px solid var(--line);padding:12px 0}.s:first-child{border-top:0}
.mute{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== KONFIGURASI (isi sendiri; anon key memang publik, JANGAN isi service role) =====
var SUPABASE_URL = "https://yloxoxgvedepmegihver.supabase.co";
var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3hveGd2ZWRlcG1lZ2lodmVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mzk4NDYsImV4cCI6MjEwMzMxNTg0Nn0.b74It13ynjkLSBqsvyuYbWmo0TkL0ztb1bj9d8TAerc";
var QRIS_STATIC = "00020101021126570011ID.DANA.WWW011893600915303471271802090347127180303UMI51440014ID.CO.QRIS.WWW0215ID10265837741240303UMI5204739453033605802ID5916Semilir Semarang6013Kota Semarang6105501166304285A"; // dari OMB Nota Cas
var API = SUPABASE_URL + "/functions/v1/charge-api";

var sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
var $app = document.getElementById("app");
var S = { user: null, admin: false, tab: "charge", outlets: [], tariff: 0, maxWh: 5000, sess: null, all: [], names: {}, outlet: 1, sig: "" };

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rp(n) { return "Rp" + Number(n || 0).toLocaleString("id-ID"); }
function kwh(wh) { return (Number(wh || 0) / 1000).toFixed(3); }
function toast(m) {
  var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = m;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500);
}

// ===== QRIS DINAMIS =====
function crc16(s) {
  var c = 0xFFFF;
  for (var i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1);
    c &= 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function qrisDynamic(amount) {
  var f = [], p = QRIS_STATIC, k = 0;
  while (k < p.length) { var l = parseInt(p.substr(k + 2, 2), 10); f.push({ t: p.substr(k, 2), v: p.substr(k + 4, l) }); k += 4 + l; }
  f = f.filter(function (x) { return x.t !== "63" && x.t !== "54"; });
  f.forEach(function (x) { if (x.t === "01") x.v = "12"; });
  var ci = -1; f.forEach(function (x, n) { if (x.t === "53") ci = n; });
  var a = { t: "54", v: String(Math.round(amount)) };
  if (ci >= 0) f.splice(ci + 1, 0, a); else f.push(a);
  var s = f.map(function (x) { return x.t + String(x.v.length).padStart(2, "0") + x.v; }).join("") + "6304";
  return s + crc16(s);
}

// ===== API =====
async function api(path, body) {
  var s = (await sb.auth.getSession()).data.session;
  var r = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (s ? s.access_token : "") },
    body: JSON.stringify(body || {})
  });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.message || j.error || "Gagal (" + r.status + ")");
  return j;
}

// ===== DATA =====
async function load() {
  var u = S.user.id;
  var q = await Promise.all([
    sb.from("charge_outlets").select("*").order("id"),
    sb.from("charge_tariffs").select("price_per_kwh").order("effective_from", { ascending: false }).limit(1),
    sb.from("charge_config").select("max_target_wh").maybeSingle(),
    sb.from("charge_sessions").select("*").eq("user_id", u).order("created_at", { ascending: false }).limit(1)
  ]);
  S.outlets = q[0].data || [];
  S.tariff = q[1].data && q[1].data[0] ? q[1].data[0].price_per_kwh : 0;
  S.maxWh = q[2].data ? q[2].data.max_target_wh : 5000;
  S.sess = q[3].data && q[3].data[0] ? q[3].data[0] : null;
  if (S.admin && S.tab === "admin") {
    var a = await sb.from("charge_sessions").select("*").order("created_at", { ascending: false }).limit(30);
    S.all = a.data || [];
    var ids = S.all.map(function (x) { return x.member_id; });
    var m = await sb.from("anggota_omb").select("id,nama").in("id", ids);
    if (m.data) m.data.forEach(function (x) { S.names[x.id] = x.nama; });
  }
  var sig = JSON.stringify([S.sess, S.all, S.tariff, S.tab, S.outlets]);
  if (sig !== S.sig) { S.sig = sig; render(); }
}

// ===== TAMPILAN =====
function login(err) {
  $app.innerHTML = '<h1>OMB Charge</h1><p class="sub">Masuk dengan akun anggota.</p><div class="card">' +
    '<label class="mute" for="em">Email</label><input id="em" type="email" autocomplete="username">' +
    '<label class="mute" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">' +
    '<p class="mute" style="color:var(--bad)">' + esc(err || "") + '</p>' +
    '<button class="big acc" data-act="login">Masuk</button></div>';
}

function head() {
  var t = S.admin ? '<div class="tabs"><button class="' + (S.tab === "charge" ? "" : "ghost") + '" data-act="tab" data-v="charge">Cas</button>' +
    '<button class="' + (S.tab === "admin" ? "" : "ghost") + '" data-act="tab" data-v="admin">Admin</button></div>' : "";
  return '<div class="row sp"><h1>OMB Charge</h1><button class="ghost sm" data-act="logout">Keluar</button></div>' + t;
}

function render() {
  if (!S.user) return login();
  $app.innerHTML = head() + (S.tab === "admin" && S.admin ? adminView() : userView());
  var q = document.getElementById("qr");
  if (q && S.sess) {
    try { new QRCode(q, { text: qrisDynamic(S.sess.amount_idr), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { q.textContent = "QRIS belum diatur"; }
  }
}

function userView() {
  var s = S.sess;
  if (s && (s.status === "pending" || s.status === "running")) {
    var used = s.status === "running" ? Math.max(0, (s.last_wh || s.start_wh) - s.start_wh) : 0;
    return '<p class="sub">Colokan ' + s.outlet_id + '</p><div class="card"><span class="tag run">' +
      (s.status === "pending" ? "Menunggu perangkat" : s.stop_requested_at ? "Menghentikan..." : "Sedang mengisi") + '</span>' +
      '<div class="num">' + kwh(used) + ' <small class="mute">kWh</small></div>' +
      '<div class="mute">Perkiraan biaya ' + rp(Math.ceil(used * s.tariff_per_kwh / 1000 / 100) * 100) + '</div>' +
      '<p class="mute">Berhenti saat Anda menekan Stop, atau otomatis jika tidak ada aliran listrik 10 detik.</p>' +
      '<button class="big bad" data-act="stop"' + (s.stop_requested_at ? " disabled" : "") + '>Stop</button></div>';
  }
  if (s && s.payment_status === "unpaid") {
    return '<p class="sub">Tagihan belum lunas</p><div class="card"><span class="tag unpaid">Belum dibayar</span>' +
      '<div class="num">' + rp(s.amount_idr) + '</div><div class="mute">' + kwh(s.used_wh) + ' kWh x ' + rp(s.tariff_per_kwh) + '/kWh</div>' +
      '<div id="qr"></div><p class="mute">Bayar lewat QRIS di atas. Admin akan memverifikasi pembayaran secara manual, lalu Anda bisa mengisi lagi.</p></div>';
  }
  var o = S.outlets.map(function (x) {
    return '<button class="outlet ' + (S.outlet === x.id ? "sel" : "") + '" data-act="outlet" data-v="' + x.id + '">' + esc(x.name) +
      '<small>' + (x.is_available ? "Tersedia" : "Tidak tersedia") + '</small></button>';
  }).join("");
  var last = s && s.payment_status === "paid" ? '<p class="mute">Sesi terakhir: ' + kwh(s.used_wh) + ' kWh, ' + rp(s.amount_idr) + ' (lunas).</p>' : "";
  return '<p class="sub">Pilih colokan, lalu tekan Mulai.</p><h2>Colokan</h2><div class="outlets">' + o + '</div>' +
    '<p class="mute">Tarif ' + rp(S.tariff) + '/kWh. Tagihan dihitung dari pemakaian saat Stop.</p>' + last +
    '<button class="big acc" data-act="start">Mulai</button>';
}

function adminView() {
  var rows = S.all.map(function (x) {
    var btn = "";
    if (x.payment_status === "unpaid") btn += '<button class="sm" data-act="paid" data-v="' + x.id + '">Tandai lunas</button> ';
    if (x.status === "running") btn += '<button class="sm ghost" data-act="finish" data-v="' + x.id + '">Selesaikan manual</button> ';
    if (x.status === "pending") btn += '<button class="sm ghost" data-act="cancel" data-v="' + x.id + '">Batalkan</button> ';
    var pay = x.payment_status === "paid" ? "paid" : x.payment_status === "unpaid" ? "unpaid" : "";
    return '<div class="s"><div class="row sp"><b>' + esc(S.names[x.member_id] || "Member " + x.member_id) + '</b><span class="tag ' + (x.status === "running" ? "run" : pay) + '">' + esc(x.status) + '</span></div>' +
      '<div class="mute">Colokan ' + x.outlet_id + ' - ' + new Date(x.created_at).toLocaleString("id-ID") + '</div>' +
      '<div>' + (x.used_wh != null ? kwh(x.used_wh) + ' kWh, ' + rp(x.amount_idr) : 'Target ' + kwh(x.target_wh) + ' kWh') +
      (x.status === "running" ? ' <span class="mute">(terakhir ' + kwh((x.last_wh || x.start_wh) - x.start_wh) + ' kWh)</span>' : "") + '</div>' +
      (x.stop_reason ? '<div class="mute">Berhenti: ' + esc(x.stop_reason) + '</div>' : "") +
      '<div class="row" style="margin-top:6px;flex-wrap:wrap">' + btn + '</div></div>';
  }).join("");
  return '<button class="big bad" data-act="off">OFF darurat colokan 1</button>' +
    '<h2>Tarif per kWh</h2><div class="card"><div class="mute">Sekarang ' + rp(S.tariff) + '. Sesi yang sudah berjalan tidak berubah.</div>' +
    '<div class="row" style="margin-top:8px"><input id="tf" type="number" inputmode="numeric" min="1" placeholder="Rupiah per kWh"><button data-act="tariff">Simpan tarif</button></div></div>' +
    '<h2>Sesi terbaru</h2><div class="card">' + (rows || '<p class="mute">Belum ada sesi.</p>') + '</div>';
}

// ===== AKSI =====
document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, v = b.dataset.v;
  try {
    if (act === "login") {
      var r = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
      if (r.error) return login("Email atau password salah.");
      return boot();
    }
    if (act === "logout") { await sb.auth.signOut(); S.user = null; S.sig = ""; return login(); }
    if (act === "tab") { S.tab = v; S.sig = ""; return load(); }
    if (act === "outlet") {
      var o = S.outlets.filter(function (x) { return String(x.id) === v; })[0];
      if (!o || !o.is_available) return toast("Colokan tidak tersedia");
      S.outlet = o.id; S.sig = ""; return render();
    }
    if (act === "start") {
      var o2 = S.outlets.filter(function (x) { return x.id === S.outlet; })[0];
      if (!o2 || !o2.is_available) return toast("Colokan tidak tersedia");
      b.disabled = true;
      await api("/session", { outlet_id: S.outlet, target_wh: S.maxWh });
      toast("Menunggu perangkat menyalakan colokan");
    }
    if (act === "stop") {
      if (!confirm("Hentikan pengisian sekarang?")) return;
      b.disabled = true;
      await api("/session/stop", {});
      toast("Perintah stop dikirim");
    }
    if (act === "paid") await api("/admin/paid", { session_id: v });
    if (act === "cancel") await api("/admin/finish", { session_id: v, action: "cancel" });
    if (act === "finish") {
      if (!confirm("Selesaikan sesi dengan kWh dari status terakhir perangkat?")) return;
      await api("/admin/finish", { session_id: v });
    }
    if (act === "off") {
      if (!confirm("Matikan colokan 1 sekarang?")) return;
      var res = await api("/admin/off", { outlet_id: 1 });
      toast(res.action === "stop_requested" ? "Perintah OFF dikirim, relay mati dalam beberapa detik" : "OFF diproses: " + res.action);
    }
    if (act === "tariff") {
      var p = parseInt(document.getElementById("tf").value, 10);
      if (!p || p < 1) return toast("Isi tarif dalam rupiah");
      var ins = await sb.from("charge_tariffs").insert({ price_per_kwh: p });
      if (ins.error) throw new Error("Gagal menyimpan tarif");
      toast("Tarif disimpan");
    }
    S.sig = ""; load();
  } catch (err) { toast(err.message); b.disabled = false; }
});

async function boot() {
  var s = (await sb.auth.getSession()).data.session;
  if (!s) return login();
  S.user = s.user;
  var a = await sb.from("charge_admins").select("user_id").eq("user_id", s.user.id).maybeSingle();
  S.admin = !!(a.data);
  await load();
}
setInterval(function () { if (S.user && document.visibilityState === "visible") load(); }, 4000);
boot();
</script>
</body>
</html>
