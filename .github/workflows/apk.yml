name: Build APK Android

on:
  workflow_dispatch:   # dijalankan manual lewat tombol "Run workflow"

permissions:
  contents: write      # untuk membuat halaman unduhan (Release)

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Ikon dan splash screen
        continue-on-error: true   # kalau gagal, APK tetap jadi dengan ikon bawaan
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Sinkronkan
        run: npx cap sync android

      - name: Pakai keystore tetap (agar update APK bisa menimpa versi lama)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OMB-Service.apk

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMB-Service-apk
          path: apk/OMB-Service.apk

      - name: Terbitkan link unduhan (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest apk/OMB-Service.apk \
            --title "OMB Service (Android)" \
            --notes "Unduh OMB-Service.apk lalu pasang di HP Android. Dibuat: $(date -u +'%Y-%m-%d %H:%M UTC')"
